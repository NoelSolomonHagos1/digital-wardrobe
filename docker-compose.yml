services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_wardrobe
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe_dev_password
    ports:
      - "5432:5432"
    volumes:
      - wardrobe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d digital_wardrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wardrobe_pgdata:
